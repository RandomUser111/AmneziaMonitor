name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: zip
          - os: windows-latest
            rid: win-arm64
            ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
          - os: ubuntu-latest
            rid: linux-arm64
            ext: tar.gz

    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore runtime assets
        run: dotnet restore src/AmneziaDashboard.App/AmneziaDashboard.App.csproj -r ${{ matrix.rid }}

      - name: Publish compact build
        run: >-
          dotnet publish src/AmneziaDashboard.App/AmneziaDashboard.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained false
          --no-restore
          -p:Version=${{ env.VERSION }}
          -p:UseAppHost=true
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/${{ matrix.rid }}

      - name: Sign Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $required = "${{ vars.WINDOWS_SIGNING_REQUIRED }}" -eq "true"
          ./scripts/sign-windows.ps1 -Files "publish/${{ matrix.rid }}/AmneziaMonitor.exe" -RequireSignature:$required

      - name: Add license files
        shell: bash
        run: |
          cp LICENSE "publish/${{ matrix.rid }}/LICENSE"
          cp THIRD_PARTY_NOTICES.md "publish/${{ matrix.rid }}/THIRD_PARTY_NOTICES.md"

      - name: Add runtime note Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @"
          Amnezia Monitor ${{ env.VERSION }}
          Platform: ${{ matrix.rid }}

          Compact build. Requires .NET 10 Runtime:
          https://dotnet.microsoft.com/download/dotnet/10.0
          "@ | Set-Content "publish/${{ matrix.rid }}/README-RUNTIME.txt" -Encoding UTF8

      - name: Add runtime note Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cat > "publish/${{ matrix.rid }}/README-RUNTIME.txt" <<EOF2
          Amnezia Monitor ${{ env.VERSION }}
          Platform: ${{ matrix.rid }}

          Compact build. Requires .NET 10 Runtime:
          https://dotnet.microsoft.com/download/dotnet/10.0
          EOF2

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "publish/${{ matrix.rid }}/*" `
            -DestinationPath "AmneziaMonitor-v${{ env.VERSION }}-${{ matrix.rid }}.zip"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -C "publish/${{ matrix.rid }}" \
            -czf "AmneziaMonitor-v${VERSION}-${{ matrix.rid }}.tar.gz" .

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaMonitor-${{ matrix.rid }}
          path: AmneziaMonitor-v${{ env.VERSION }}-${{ matrix.rid }}.${{ matrix.ext }}
          if-no-files-found: error

  windows-installer:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore and publish Windows x64
        shell: pwsh
        run: |
          dotnet restore src/AmneziaDashboard.App/AmneziaDashboard.App.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/AmneziaDashboard.App/AmneziaDashboard.App.csproj `
            -c Release -r win-x64 --self-contained false --no-restore `
            -p:Version=$env:VERSION -p:UseAppHost=true -p:PublishSingleFile=false `
            -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false `
            -o publish/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE publish/win-x64/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md publish/win-x64/THIRD_PARTY_NOTICES.md

      - name: Sign installed application executable
        shell: pwsh
        run: |
          $required = "${{ vars.WINDOWS_SIGNING_REQUIRED }}" -eq "true"
          ./scripts/sign-windows.ps1 -Files "publish/win-x64/AmneziaMonitor.exe" -RequireSignature:$required

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          New-Item -ItemType Directory -Force installer-output | Out-Null
          $source = (Resolve-Path "publish/win-x64").Path
          $output = (Resolve-Path "installer-output").Path
          & $iscc "/DMyAppVersion=$env:VERSION" "/DSourceDir=$source" "/DOutputDir=$output" "packaging/windows/AmneziaMonitor.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer executable
        shell: pwsh
        run: |
          $required = "${{ vars.WINDOWS_SIGNING_REQUIRED }}" -eq "true"
          ./scripts/sign-windows.ps1 -Files "installer-output/AmneziaMonitor-v$env:VERSION-win-x64-setup.exe" -RequireSignature:$required

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaMonitor-win-x64-installer
          path: installer-output/AmneziaMonitor-v${{ env.VERSION }}-win-x64-setup.exe
          if-no-files-found: error

  linux-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
          - rid: linux-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Resolve version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install fpm
        run: gem install --no-document fpm

      - name: Restore and publish
        shell: bash
        run: |
          dotnet restore src/AmneziaDashboard.App/AmneziaDashboard.App.csproj -r "${{ matrix.rid }}"
          dotnet publish src/AmneziaDashboard.App/AmneziaDashboard.App.csproj \
            -c Release -r "${{ matrix.rid }}" --self-contained false --no-restore \
            -p:Version="$VERSION" -p:UseAppHost=true -p:PublishSingleFile=false \
            -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false \
            -o "publish/${{ matrix.rid }}"

      - name: Build deb and rpm
        shell: bash
        run: ./scripts/package-linux.sh "$VERSION" "${{ matrix.rid }}" "publish/${{ matrix.rid }}" packages

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaMonitor-${{ matrix.rid }}-packages
          path: |
            packages/*.deb
            packages/*.rpm
          if-no-files-found: error

  github-release:
    needs:
      - publish
      - windows-installer
      - linux-packages
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Amnezia Monitor $GITHUB_REF_NAME" \
            --generate-notes
