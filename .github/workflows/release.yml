name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix, for example 1.0.2'
        required: true
        default: '1.0.2'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: zip
          - os: windows-latest
            rid: win-arm64
            ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
          - os: ubuntu-latest
            rid: linux-arm64
            ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore runtime assets
        run: dotnet restore src/AmneziaDashboard.App/AmneziaDashboard.App.csproj -r ${{ matrix.rid }}

      - name: Publish compact build
        run: >-
          dotnet publish src/AmneziaDashboard.App/AmneziaDashboard.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained false
          --no-restore
          -p:Version=${{ env.VERSION }}
          -p:UseAppHost=true
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/${{ matrix.rid }}

      - name: Add license files
        shell: bash
        run: |
          cp LICENSE "publish/${{ matrix.rid }}/LICENSE"
          cp THIRD_PARTY_NOTICES.md "publish/${{ matrix.rid }}/THIRD_PARTY_NOTICES.md"

      - name: Add runtime note (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @"
          Amnezia Monitor ${{ env.VERSION }}
          Platform: ${{ matrix.rid }}

          Compact build. Requires .NET 10 Runtime:
          https://dotnet.microsoft.com/download/dotnet/10.0
          "@ | Set-Content "publish/${{ matrix.rid }}/README-RUNTIME.txt" -Encoding UTF8

      - name: Add runtime note (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cat > "publish/${{ matrix.rid }}/README-RUNTIME.txt" <<TXT
          Amnezia Monitor ${{ env.VERSION }}
          Platform: ${{ matrix.rid }}

          Compact build. Requires .NET 10 Runtime:
          https://dotnet.microsoft.com/download/dotnet/10.0
          TXT

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "AmneziaMonitor-v${{ env.VERSION }}-${{ matrix.rid }}.zip"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -C "publish/${{ matrix.rid }}" -czf "AmneziaMonitor-v${VERSION}-${{ matrix.rid }}.tar.gz" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaMonitor-${{ matrix.rid }}
          path: AmneziaMonitor-v${{ env.VERSION }}-${{ matrix.rid }}.${{ matrix.ext }}
          if-no-files-found: error

   github-release:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Amnezia Monitor $GITHUB_REF_NAME" \
            --generate-notes