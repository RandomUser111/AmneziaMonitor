name: Bug report
description: Report a reproducible problem in Amnezia Monitor
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, VPN private keys, or other secrets.
  - type: input
    id: version
    attributes:
      label: Amnezia Monitor version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove passwords, private keys and private infrastructure information before posting.
